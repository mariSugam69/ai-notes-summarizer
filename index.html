<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Notes Summarizer</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background: linear-gradient(120deg,#1e3c72,#2a5298);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

/* Container */
.container{
background: rgba(255,255,255,0.15);
backdrop-filter: blur(18px);
width:90%;
max-width:700px;
padding:30px;
border-radius:16px;
color:white;
box-shadow:0 8px 32px rgba(0,0,0,0.3);
}

h1{text-align:center;}
.subtitle{text-align:center;color:#ddd;margin-bottom:20px;}

/* File Upload */
.file-upload{
display:flex;
align-items:center;
gap:10px;
margin-bottom:15px;
}

.file-upload input{
display:none;
}

.file-label{
background: linear-gradient(135deg,#36d1dc,#5b86e5);
padding:10px 18px;
border-radius:8px;
cursor:pointer;
color:white;
font-weight:bold;
}

.file-name{
font-size:14px;
color:#eee;
}

/* Textarea */
textarea{
width:100%;
height:180px;
padding:15px;
border-radius:10px;
border:none;
resize:none;
font-size:15px;
background:white;
color:black;
}

/* Buttons */
button{
width:100%;
padding:12px;
margin-top:15px;
background: linear-gradient(135deg,#ff512f,#dd2476);
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
color:white;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

.copy{
background: linear-gradient(135deg,#00c853,#00e676);
}

/* Output */
.output{margin-top:25px;}

.output p{
background:white;
color:black;
padding:15px;
border-radius:10px;
min-height:80px;
}

/* Loader */
.loader{
display:none;
margin:15px auto;
width:40px;
height:40px;
border:4px solid rgba(255,255,255,0.3);
border-top:4px solid #fff;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{transform:rotate(360deg);}
}

.copied{
margin-top:8px;
color:#00ff66;
display:none;
text-align:center;
}
</style>
</head>

<body>

<div class="container">

<h1>📄 AI Notes Summarizer</h1>
<p class="subtitle">Summarize text or upload PDF</p>

<div class="file-upload">
<label for="pdfUpload" class="file-label">📂 Choose PDF</label>
<input type="file" id="pdfUpload" accept="application/pdf">
<span class="file-name" id="fileName">No file chosen</span>
</div>

<textarea id="inputText" placeholder="Paste notes or upload PDF..."></textarea>

<button id="sumBtn" onclick="summarize()">Summarize</button>

<div class="loader" id="loader"></div>

<div class="output">
<h2>Summary</h2>
<p id="outputText">Your summary will appear here...</p>
<button class="copy" onclick="copyText()">Copy Text</button>
<p class="copied" id="copiedMsg">✔ Copied to clipboard</p>
</div>

</div>

<script>
document.getElementById("pdfUpload").addEventListener("change", async function(e){
const file=e.target.files[0];

document.getElementById("fileName").textContent=file?file.name:"No file chosen";
if(!file) return;

const reader=new FileReader();
reader.onload=async function(){
const typedarray=new Uint8Array(this.result);
const pdf=await pdfjsLib.getDocument(typedarray).promise;

let text="";
for(let i=1;i<=pdf.numPages;i++){
const page=await pdf.getPage(i);
const content=await page.getTextContent();
content.items.forEach(item=>text+=item.str+" ");
}
document.getElementById("inputText").value=text;
};
reader.readAsArrayBuffer(file);
});

async function summarize(){
const text=document.getElementById("inputText").value;
if(!text.trim()) return alert("Enter text");

const btn=document.getElementById("sumBtn");
const loader=document.getElementById("loader");

btn.disabled=true;
loader.style.display="block";
document.getElementById("outputText").innerText="";

try{
const response=await fetch("http://127.0.0.1:5000/summarize",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({text})
});

const data=await response.json();
document.getElementById("outputText").innerText=data.summary;

}catch{
document.getElementById("outputText").innerText="Backend not connected!";
}

loader.style.display="none";
btn.disabled=false;
}

function copyText(){
navigator.clipboard.writeText(
document.getElementById("outputText").innerText
);

const msg=document.getElementById("copiedMsg");
msg.style.display="block";
setTimeout(()=>msg.style.display="none",1500);
}
</script>

</body>
</html>
